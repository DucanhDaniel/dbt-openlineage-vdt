[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-learn"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "markdown>=3.0",
    "dbt-core>=1.8,<2.0",
    "dbt-duckdb>=1.8,<2.0",
    "dbt-postgres>=1.8,<2.0",
    "duckdb>=1.0",
    "openlineage-dbt",
    "shandy-sqlfmt[jinjafmt]",
]

[project.scripts]
dbt-learn = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "verifier*", "quiz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
