version: 2

models:
    - name: stg_fb_age_gender
      description: "One row per ad daily, broken down by age and gender."
      columns:
        - name: user_id
          data_type: text
          description: "User id, whom created this row"

        - name: created_at
          data_type: timestamp
          description: "Timestamp of row creation"

        - name: updated_at
          data_type: timestamp
          description: "Timestamp of last update"

        - name: date_start
          data_type: timestamp
          description: "Metric start date"

        - name: date_stop
          data_type: timestamp
          description: "Metric end date"

        - name: account_id
          data_type: text
        - name: account_name
          data_type: text
        - name: ad_id
          data_type: text
        - name: ad_name
          data_type: text
        - name: creative_id
          data_type: text
        - name: creative_name
          data_type: text
        - name: creative_link
          data_type: text
        - name: age
          data_type: text
        - name: gender
          data_type: text
        - name: spend
          data_type: double precision
        - name: impressions
          data_type: integer
        - name: reach
          data_type: integer
        - name: clicks
          data_type: integer
        - name: cpc
          data_type: double precision
        - name: cpm
          data_type: double precision
        - name: frequency
          data_type: double precision

      tests:
        - not_null_columns:
            columns: ["user_id", "created_at", "updated_at", "date_start", "date_stop", "ad_id"]

    - name: stg_fb_location
      description: "One row per ad daily, broken down by location."
      columns:
        - name: user_id
          data_type: text
          description: "User id, whom created this row"

        - name: created_at
          data_type: timestamp
          description: "Timestamp of row creation"

        - name: updated_at
          data_type: timestamp
          description: "Timestamp of last update"

        - name: date_start
          data_type: timestamp
          description: "Metric start date"

        - name: date_stop
          data_type: timestamp
          description: "Metric end date"

        - name: account_id
          data_type: text
        - name: account_name
          data_type: text
        - name: ad_id
          data_type: text
        - name: ad_name
          data_type: text
        - name: creative_id
          data_type: text
        - name: creative_name
          data_type: text
        - name: country
          data_type: text
        - name: region
          data_type: text
        - name: spend
          data_type: double precision
        - name: impressions
          data_type: integer
        - name: reach
          data_type: integer
        - name: clicks
          data_type: integer
        - name: cpc
          data_type: double precision
        - name: cpm
          data_type: double precision
        - name: frequency
          data_type: double precision

      tests:
        - not_null_columns:
            columns: ["user_id", "created_at", "updated_at", "date_start", "date_stop", "ad_id"]

    - name: stg_province_normalization
      description: "Staging model for province_normalization seed to ensure OpenLineage captures it correctly"
      columns:
        - name: original_province
          data_type: text
        - name: standardized_province
          data_type: text