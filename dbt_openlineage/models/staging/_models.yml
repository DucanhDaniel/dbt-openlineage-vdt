version: 2

models:
    - name: stg_customers
      description: "Staged customer data from jaffle shop."
      columns:
        - name: customer_id
          data_type: text
          description: "Primary key for customer."
          tests:
            - unique
            - not_null
        - name: customer_name
          data_type: text
          description: "Customer name."

    - name: stg_stores
      description: "Staged store locations data."
      columns:
        - name: store_id
          data_type: text
          description: "Primary key for store."
          tests:
            - unique
            - not_null
        - name: store_name
          data_type: text
          description: "Store name."
        - name: opened_at
          data_type: timestamp
          description: "Store opening timestamp."
        - name: tax_rate
          data_type: double precision
          description: "Store tax rate."

    - name: stg_orders
      description: "Staged orders data."
      columns:
        - name: order_id
          data_type: text
          description: "Primary key for order."
          tests:
            - unique
            - not_null
        - name: customer_id
          data_type: text
          description: "Foreign key to customer."
        - name: ordered_at
          data_type: timestamp
          description: "Order timestamp."
        - name: store_id
          data_type: text
          description: "Foreign key to store."
        - name: subtotal
          data_type: integer
          description: "Order subtotal before tax."
        - name: tax_paid
          data_type: integer
          description: "Amount of tax paid for the order."
        - name: order_total
          data_type: integer
          description: "Total amount paid for the order."

    - name: stg_items
      description: "Staged order items data."
      columns:
        - name: item_id
          data_type: text
          description: "Primary key for item."
          tests:
            - unique
            - not_null
        - name: order_id
          data_type: text
          description: "Foreign key to order."
        - name: product_id
          data_type: text
          description: "Foreign key to product."

    - name: stg_products
      description: "Staged products data."
      columns:
        - name: product_id
          data_type: text
          description: "Primary key for product."
          tests:
            - unique
            - not_null
        - name: product_name
          data_type: text
          description: "Product name."
        - name: type
          data_type: text
          description: "Product type."
        - name: price
          data_type: integer
          description: "Product price."
        - name: description
          data_type: text
          description: "Product description."

    - name: stg_supplies
      description: "Staged supplies data."
      columns:
        - name: supplier_id
          data_type: text
          description: "Primary key for supply."
          tests:
            - not_null
        - name: supplier_name
          data_type: text
          description: "Supplier name."
        - name: cost
          data_type: integer
          description: "Supply cost."
        - name: perishable
          data_type: boolean
          description: "Is perishable."
        - name: product_id
          data_type: text
          description: "Associated product ID."