version: 2

models:
    - name: int_customers
      description: "Intermediate customer model."
      columns:
        - name: customer_id
          data_type: text
          tests:
            - unique
            - not_null
        - name: customer_name
          data_type: text

    - name: int_stores
      description: "Intermediate store model."
      columns:
        - name: store_id
          data_type: text
          tests:
            - unique
            - not_null
        - name: store_name
          data_type: text
        - name: opened_at
          data_type: timestamp
        - name: tax_rate
          data_type: double precision

    - name: int_order_product
      description: "Intermediate model joining orders, items, and products."
      columns:
        - name: order_id
          data_type: text
        - name: customer_id
          data_type: text
        - name: ordered_at
          data_type: timestamp
        - name: store_id
          data_type: text
        - name: subtotal
          data_type: integer
        - name: tax_paid
          data_type: integer
        - name: total
          data_type: integer
        - name: product_id
          data_type: text
        - name: item_id
          data_type: text
          tests:
            - unique
            - not_null

    - name: int_supplies
      description: "Intermediate supplies model."
      columns:
        - name: supplier_id
          data_type: text
          tests:
            - not_null
            
        - name: supplier_name
          data_type: text
        - name: cost
          tests:
            - not_null
          data_type: integer
        - name: perishable
          data_type: boolean
        - name: product_id
          data_type: text