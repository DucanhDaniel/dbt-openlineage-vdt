version: 2

models:
    - name: int_fb_age_gender
      description: "One row per ad daily, broken down by age and gender."
      columns:

        - name: created_at
          description: "Timestamp of row creation"

        - name: updated_at
          description: "Timestamp of last update"

        - name: date_start
          description: "Metric start date"

        - name: date_stop
          description: "Metric end date"

        - name: account_id
        - name: account_name
        - name: ad_id
        - name: ad_name
        - name: creative_id
        - name: creative_name
        - name: creative_link
        - name: age
        - name: gender
        - name: spend
        - name: impressions
        - name: reach
        - name: clicks
        - name: cpc
        - name: cpm
        - name: frequency
        - name: ctr

      tests:
        - not_null_columns:
            columns: ["created_at", "updated_at", "date_start", "date_stop", "ad_id"]

    - name: int_fb_location
      description: "One row per ad daily, broken down by location."
      columns:
        - name: created_at
          description: "Timestamp of row creation"

        - name: updated_at
          description: "Timestamp of last update"

        - name: date_start
          description: "Metric start date"

        - name: date_stop
          description: "Metric end date"

        - name: account_id
        - name: account_name
        - name: ad_id
        - name: ad_name
        - name: creative_id
        - name: creative_name
        - name: country
        - name: region
        - name: spend
        - name: impressions
        - name: reach
        - name: clicks
        - name: cpc
        - name: cpm
        - name: frequency
        - name: ctr

      tests:
        - not_null_columns:
            columns: ["created_at", "updated_at", "date_start", "date_stop", "ad_id"]