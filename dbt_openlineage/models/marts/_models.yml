version: 2

models:
  - name: fact_orders
    description: "Fact table for orders"
    columns:
      - name: item_id
        data_type: text
        tests:
          - unique
          - not_null
      - name: order_id
        data_type: text
      - name: customer_id
        data_type: text
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        data_type: text
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: store_id
        data_type: text
        tests:
          - relationships:
              to: ref('dim_stores')
              field: store_id
      - name: ordered_at
        data_type: timestamp
      - name: tax_paid
        data_type: integer
      - name: total
        data_type: integer
      - name: subtotal
        data_type: integer

  - name: dim_customers
    description: "Dimension table for customers"
    columns:
      - name: customer_id
        data_type: text
        tests:
          - unique
          - not_null
      - name: customer_name
        data_type: text

  - name: dim_stores
    description: "Dimension table for stores"
    columns:
      - name: store_id
        data_type: text
        tests:
          - unique
          - not_null
      - name: store_name
        data_type: text
      - name: opened_at
        data_type: timestamp
      - name: tax_rate
        data_type: double precision

  - name: dim_supplies
    description: "Dimension table for supplies"
    columns:
      - name: supplier_id
        data_type: text
        tests:
          - not_null
      - name: product_id
        data_type: text
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: supplier_name
        data_type: text
      - name: cost
        data_type: integer
      - name: perishable
        data_type: boolean

  - name: dim_products
    description: "Dimension table for products"
    columns:
      - name: product_id
        data_type: text
        tests:
          - unique
          - not_null
      - name: product_name
        data_type: text
      - name: type
        data_type: text
      - name: price
        data_type: integer
      - name: description
        data_type: text
