services:
  scheduler:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
    extra_hosts:
      - "localpg:host-gateway"
  dag-processor:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
    extra_hosts:
      - "localpg:host-gateway"
  api-server:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
    extra_hosts:
      - "localpg:host-gateway"
  triggerer:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
    extra_hosts:
      - "localpg:host-gateway"

  marquez-db:
    image: postgres:14
    env_file:
      - .env.marquez
    ports:
      - "5433:5432"
    volumes:
      - marquez_postgres_data:/var/lib/postgresql/data

  marquez:
    image: marquezproject/marquez:latest
    restart: on-failure
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env.marquez
    environment:
      - POSTGRES_HOST=marquez-db
      - POSTGRES_PORT=5432
    depends_on:
      - marquez-db

  marquez-web:
    image: marquezproject/marquez-web:latest
    ports:
      - "3000:3000"
    environment:
      - WEB_PORT=3000
      - MARQUEZ_URL=http://localhost:5000
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
    depends_on:
      - marquez

  ol-proxy:
    image: python:3.11-slim
    command: >
      bash -c "pip install flask requests && python /app/proxy.py"
    volumes:
      - ./ol_proxy:/app
    ports:
      - "5002:5002"
    environment:
      - MARQUEZ_URL=http://marquez:5000/api/v1/lineage
      - OM_URL=http://103.102.131.30:8585/api/v1/openlineage/lineage
      - OM_TOKEN=eyJraWQiOiJHYjM4OWEtOWY3Ni1nZGpzLWE5MmotMDI0MmJrOTQzNTYiLCJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..zdWU3jIUtwj8nEshbujN6ql9BaDweY_6YoRg9wPu8VK-lC4gmnxCsFJ_zRZCkWQBe5kTzoCM33Q5-d3YOZnLRlJz_dMojnOMnNQoYFhdXKhhOu2Gw65kl7LvJd4d_PtLDe1nyuaHHBB7jGZVFypaAyRbwAnthHWCgzFxOmvmJPXfwJpxwER1WjnOib8kyiQOo8l6zSiAkVsYEVFBwyR4daTqojnmXW5ApfqhgotOmPPE3XJDwW0YU1B4MDOVznj7H7FqRShe2zTolLqieTFvnVz31wgf6eZHr3Ywa8SGOvYlOBDR_BhmprwoDIIOJ9HC-Cur7GhN5mcBvtX2RU-p0A

