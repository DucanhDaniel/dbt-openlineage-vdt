services:
  scheduler:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
  dag-processor:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
  api-server:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro
  triggerer:
    volumes:
      - ../dbt_openlineage:/usr/local/airflow/dags/dbt_openlineage:ro

  marquez-db:
    image: postgres:14
    env_file:
      - .env.marquez
    ports:
      - "5433:5432"
    volumes:
      - marquez_postgres_data:/var/lib/postgresql/data

  marquez:
    image: marquezproject/marquez:latest
    restart: on-failure
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env.marquez
    environment:
      - POSTGRES_HOST=marquez-db
      - POSTGRES_PORT=5432
    depends_on:
      - marquez-db

  marquez-web:
    image: marquezproject/marquez-web:latest
    ports:
      - "3000:3000"
    environment:
      - WEB_PORT=3000
      - MARQUEZ_URL=http://localhost:5000
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
    depends_on:
      - marquez

volumes:
  marquez_postgres_data:
